# Сборка пришита к репозиторию, а не к настройкам в панели Netlify: так её
# видно в истории и можно изменить коммитом, а не кликом, о котором никто не
# узнает.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 требует современный Node. Пин, чтобы сборка не поехала, когда
  # Netlify поменяет значение по умолчанию.
  NODE_VERSION = "22"

# Правила перенаправления — в `public/_redirects`, а не здесь. Отсюда они
# измеримо не применялись: после выкладки /auth/callback отдавал 404 Netlify.
# Из `public/` файл попадает в саму сборку, поэтому работает независимо от
# того, нашёл ли Netlify этот файл настроек.
