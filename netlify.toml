# Сборка пришита к репозиторию, а не к настройкам в панели Netlify: так её
# видно в истории и можно изменить коммитом, а не кликом, о котором никто не
# узнает.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 требует современный Node. Пин, чтобы сборка не поехала, когда
  # Netlify поменяет значение по умолчанию.
  NODE_VERSION = "22"

# Приложение одностраничное: любой путь отдаёт index.html, иначе переход по
# ссылке из письма на что-нибудь кроме корня даст 404. Маршрутизатора пока нет,
# но правило ничего не стоит и снимает грабли заранее.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
